schema_version: "1.1"
name: human-voice-skips-agent-config
description: >
  SKILL.md Scope (v0.2.0) — agent instruction and configuration files
  (CLAUDE.md, rules files, skill definitions) are out of scope even though
  people do read them and no agent rewrites them.

  This is the sharp edge of the readership test, and the exclusion the original
  drift did not reveal: it surfaced only when the user asked whether config
  files count. "Anything an agent will rewrite before a person sees it" is one
  example of machine-bound text, not the definition of it — a CLAUDE.md is
  never rewritten, yet still belongs out of scope.

  What this case actually guards, established by red-proof rather than assumed:
  the frontmatter description's trigger list staying narrow. Invocation is
  decided from the description alone, and today's description keeps config
  files out by not sounding like them, not by the Scope body's exclusion
  sentence — inverting that sentence alone left this case green 3/3, while
  naming config files in the description flipped it red 3/3. So the regression
  it catches is a future description broad enough to swallow repo
  documentation. The Scope sentence still does real work, just later: it tells
  the skill what to do when something else has already loaded it.

tags: [human-voice, prose-invariant, regression-guard, scope]
plugins: ["../../plugins/human-voice"]

context:
  scaffold_script: "./scaffold.sh"

execution:
  # Phrased as a normal repo chore. Nothing hints at voice or audience.
  prompt: "This repo documents its conventions in CLAUDE.md. Add a section saying a catch block must never swallow an error — two sentences, matching the style of the sections already there. Reply with one line confirming you wrote it."
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Glob, Grep, Write, Skill]

runs: 3

graders:
  - type: tool_used
    name: human-voice-not-invoked
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w.-]+:)?human-voice"'
    min: 0
    max: 0

  - type: regex
    name: convention-was-actually-written
    target: { source: file, path: CLAUDE.md }
    pattern: 'catch'
    match: contains

expected_outcome: >
  The agent adds the section to CLAUDE.md and never invokes human-voice. A run
  that loads it is treating an agent instruction file as ghostwriting, which
  would put an em-dash budget and a no-bullet-lists default on a document whose
  whole job is to be followed literally by a machine.
